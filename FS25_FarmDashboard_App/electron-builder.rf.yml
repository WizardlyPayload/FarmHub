# Farm Dashboard V5 — electron-builder overlay
# Invoked by tools/app/run-electron-builder.mjs when packing V5 (--v5 / --rf / FARMDASH_PRODUCT_LINE=v5).
#
# HARD RULE: publish.channel must remain "latest-rf" so the update feed is latest-rf.yml.
# Never point V4 clients (latest.yml) at V5 installers.
# appId stays com.farmdashboard.rf so existing 5.0.x installs upgrade in place.

appId: com.farmdashboard.rf
productName: FS25 Farm Dashboard V5
extraMetadata:
  # electron-builder derives updaterCacheDirName from packaged metadata.name.
  # Keep V5's updater cache distinct without changing classic package.json.
  name: fs25-farm-dashboard-rf
  # Distinct product-line identity in About / updater metadata without bumping classic package.json.
  # Older 5.0.x packages stamped productLine: rf; runtime treats rf and v5 as the same V5 line.
  productLine: v5
  # V5 release candidate. Classic package.json and V4 update feed stay on 4.x.
  version: 5.2.12
directories:
  output: electron-pack-out-rf
files:
  - main.js
  - lanCredentialPolicy.js
  - modVersionPolicy.js
  - app-updater.js
  - preload.js
  - xmlCollector.js
  - fieldHarvestState.cjs
  - fs25Paths.js
  - fileReadRetry.js
  - dataMerger.js
  - sectionContract.cjs
  - corsPolicy.js
  - editionPolicy.cjs
  - fileCommit.cjs
  - modConfigXml.js
  - fillTypeResolve.cjs
  - farmScope.cjs
  - companionPagesMerge.cjs
  - companionPages/**/*
  - mapFillTypes.cjs
  - fillTypeHud.cjs
  - mapOverviewResolver.js
  - mapOverviewTerrainInset.cjs
  - mapOverviewInsets.cjs
  - mapFieldOutlines.cjs
  - httpFeedXml.js
  - setupAccessPolicy.cjs
  - setupConfigMerge.cjs
  - boundSourcePublication.cjs
  - exportIngress.js
  - ingressOrchestration.js
  - localIngressController.js
  - replicaRegistration.js
  - pendingReplicaSession.cjs
  - identityProvision.js
  - runtimeActivation.js
  - exportEnvelope.js
  - replicaPairContract.cjs
  - uxContract.cjs
  - fleetMapOverlays.cjs
  - fleetMapGeo.cjs
  - lanHttpPath.cjs
  - publicDemoHostPolicy.cjs
  - safeFsIdentity.cjs
  - ftpAccess.cjs
  - uiServePolicy.cjs
  - package.json
  - detailAnimalsHydrate.js
  - livestockDetail.js
  - serverDataCache.js
  - mergedSnapshotHold.js
  - rfProviderState.cjs
  - liveExportFreshness.js
  - stockMoistureFromXml.js
  - icon.ico
  - web/**/*
  # Runtime-generated mod thumbnails are profile cache, not release assets.
  # The installed V5 build omits them; including them adds about 607 MB.
  - "!web/assests/img/items_mod_extract/**/*"
  - "!web/index.html"
  - "!web/simhub.html"
  - ui-v2/**/*
  - node_modules/**/*
  # Private env / translation-key files. Matching is in order, so these stay after every include.
  # tools/app/privatePackageGuard.cjs fails the build if any of them is selected or packed anyway.
  - "!**/.mt-env*"
  - "!**/.mt-cache*"
  - "!**/.env"
  - "!**/.env.*"
  - "!**/.envrc"
extraResources:
  - from: ../tools/Export-ModStoreImages.ps1
    to: tools/Export-ModStoreImages.ps1
  - from: build/install-imagemagick.ps1
    to: install-imagemagick.ps1
  - from: build/uninstall-user-data.ps1
    to: uninstall-user-data.ps1
  - from: build/uninstall-dependencies.ps1
    to: uninstall-dependencies.ps1
  - from: build/imagemagick-common.ps1
    to: imagemagick-common.ps1
  - from: build/windows-install-state.ps1
    to: windows-install-state.ps1
  - from: resources/imagemagick
    to: imagemagick
    filter:
      - "**/*"
  - from: resources/texconv
    to: texconv
    filter:
      - "**/*"
  - from: resources/map-overview-extract
    to: map-overview-extract
    filter:
      - "**/*"
win:
  target: nsis
  icon: icon.ico
  artifactName: FS25-Farm-Dashboard-V5-Setup-${version}.${ext}
  signExts:
    - ".dll"
  signtoolOptions:
    publisherName: JoshWalki / WizardlyPayload
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  runAfterFinish: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Farm Dashboard V5
  warningsAsErrors: false
  include: build/installer.nsh
publish:
  provider: github
  owner: WizardlyPayload
  repo: FarmHub
  releaseType: release
  # Produces latest-rf.yml — V4 clients must keep using latest.yml
  channel: latest-rf
