<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Tablet — Overview Vision Prototype</title>
  <!--
    VISION PROTOTYPE — not live game UI.
    Open this file in Chrome/Edge. No build step.
    FarmHub Overview composition inside Farm Tablet chrome (FT.C tokens).
    Share screenshots / this file with Arissani & Tyson for feedback.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Farm Tablet FT.C mapped to CSS */
      --bg-deep: #0a0d12;
      --bg-panel: #12171f;
      --bg-card: #171c26;
      --bg-nav: #0d1017;
      --brand: #29c261;
      --brand-dim: #1a7038;
      --brand-glow: rgba(41, 194, 97, 0.18);
      --positive: #38e075;
      --negative: #f24747;
      --warning: #ffb81a;
      --info: #4da6ff;
      --muted: #6b707f;
      --text-bright: #f5f7fa;
      --text-normal: #c7ccd6;
      --text-dim: #a8adb8;
      --border: rgba(41, 194, 97, 0.22);
      --border-bright: rgba(41, 194, 97, 0.55);
      --rule: rgba(51, 56, 71, 0.8);
      --btn-neutral: #2e333f;
      --farm-surface: rgba(23, 28, 38, 0.92);
      --farm-border: rgba(255, 255, 255, 0.1);
      --farm-accent: var(--brand);
      --farm-text: var(--text-bright);
      --farm-text-muted: var(--text-dim);
      --farm-glass-blur: 12px;
      --bezel: #1a1e28;
      --bezel-edge: #2a3140;
      --screen-w: 900px;
      --screen-h: 600px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 30% 20%, #14201a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #101828 0%, transparent 45%),
        #06080c;
      color: var(--text-bright);
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 1rem;
    }

    .stage__note {
      max-width: 960px;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .stage__note strong { color: var(--warning); font-weight: 600; }

    /* ── Tablet shell ─────────────────────────────────────── */
    .tablet {
      width: calc(var(--screen-w) + 80px);
      max-width: 100%;
      border-radius: 28px;
      padding: 18px;
      background:
        linear-gradient(145deg, #2a3140 0%, #151922 40%, #0e1218 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 28px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
      position: relative;
    }

    .tablet__cam {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0a0c10;
      box-shadow: inset 0 0 0 1px #333;
    }

    .tablet__screen {
      width: 100%;
      aspect-ratio: 900 / 600;
      max-height: min(70vh, 600px);
      background: var(--bg-deep);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.5);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.35);
      position: relative;
    }

    .tablet__screen::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 18%);
      z-index: 5;
    }

    /* Status bar */
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 0.75rem;
      background: var(--bg-nav);
      border-bottom: 1px solid var(--rule);
      font-size: 0.7rem;
      color: var(--text-dim);
      flex-shrink: 0;
      z-index: 2;
    }
    .status__left { display: flex; gap: 0.5rem; align-items: center; }
    .status__dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 6px var(--brand);
    }

    /* App bar */
    .appbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.65rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 2;
    }
    .appbar__btn {
      appearance: none;
      border: 1px solid var(--farm-border);
      background: var(--btn-neutral);
      color: var(--text-normal);
      border-radius: 8px;
      padding: 0.28rem 0.55rem;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }
    .appbar__btn:hover { border-color: var(--border-bright); color: var(--text-bright); }
    .appbar__btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .appbar__title {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-left: 0.25rem;
    }
    .appbar__title strong {
      font-size: 0.92rem;
      letter-spacing: 0.01em;
    }
    .appbar__title span {
      font-size: 0.68rem;
      color: var(--text-dim);
    }
    .appbar__accent {
      width: 3px;
      align-self: stretch;
      border-radius: 2px;
      background: var(--brand);
      margin-right: 0.15rem;
    }

    /* Scrollable content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 0.85rem 1rem;
      z-index: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--brand-dim) transparent;
    }

    .banner {
      margin: 0 0 0.75rem;
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--warning);
      background: rgba(255, 184, 26, 0.12);
      border: 1px solid rgba(255, 184, 26, 0.35);
    }

    /* Overview header */
    .ov-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .ov-header h1 {
      margin: 0 0 0.2rem;
      font-size: 1.15rem;
    }
    .ov-header p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-dim);
      max-width: 28rem;
    }
    .ov-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      justify-content: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      border: 1px solid var(--farm-border);
      background: rgba(255,255,255,0.05);
      color: var(--text-normal);
    }
    .badge--accent {
      border-color: var(--border-bright);
      background: var(--brand-glow);
      color: var(--positive);
    }
    .weather-pill {
      appearance: none;
      display: inline-flex;
      gap: 0.35rem;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--farm-border);
      color: var(--farm-text);
      border-radius: 999px;
      padding: 0.22rem 0.6rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.72rem;
    }
    .weather-pill:hover { border-color: var(--farm-accent); }

    /* Mod chips */
    .mods { margin: 0 0 0.75rem; }
    .mods h2 {
      margin: 0 0 0.4rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }
    .mods__row { display: flex; flex-wrap: wrap; gap: 0.35rem; }

    /* Balance hero (Tablet Dashboard pattern) */
    .hero {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.9rem 0.85rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    }
    .hero__label {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 0.15rem;
    }
    .hero__row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 0.75rem;
    }
    .hero__bal {
      font-size: 1.65rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--positive);
      line-height: 1.1;
    }
    .hero__loan {
      text-align: right;
    }
    .hero__loan small {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .hero__loan strong {
      font-size: 0.95rem;
      color: var(--warning);
      font-variant-numeric: tabular-nums;
    }

    /* Alerts */
    .alerts {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.75rem;
    }
    .alert {
      appearance: none;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.65rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 184, 26, 0.35);
      background: rgba(255, 184, 26, 0.08);
      color: var(--text-bright);
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .alert:hover { border-color: var(--warning); }
    .alert__mark {
      color: var(--warning);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Tile grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .tile {
      appearance: none;
      background: var(--farm-surface);
      border: 1px solid var(--farm-border);
      border-radius: 12px;
      padding: 0.7rem 0.75rem;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(var(--farm-glass-blur));
      -webkit-backdrop-filter: blur(var(--farm-glass-blur));
      box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
      transition: border-color 0.12s ease;
    }
    .tile:hover { border-color: var(--farm-accent); }
    .tile h3 {
      margin: 0 0 0.45rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-normal);
    }
    .tile__stat {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      margin: 0;
    }
    .tile__stat strong {
      font-size: 1.35rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1.1;
    }
    .tile__stat span {
      font-size: 0.7rem;
      color: var(--text-dim);
    }
    .tile__line {
      margin: 0.4rem 0 0;
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.3;
    }
    .tile__finance {
      display: grid;
      gap: 0.3rem;
    }
    .tile__finance div {
      display: flex;
      justify-content: space-between;
      gap: 0.4rem;
      font-size: 0.75rem;
    }
    .tile__finance span { color: var(--text-dim); }
    .tile__finance strong {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .tile__warn { color: var(--warning) !important; }

    /* Farms */
    .farms { margin-bottom: 0.85rem; }
    .farms h2 {
      margin: 0 0 0.45rem;
      font-size: 0.85rem;
    }
    .farm-card {
      background: var(--farm-surface);
      border: 1px solid var(--farm-border);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.45rem;
      backdrop-filter: blur(var(--farm-glass-blur));
      box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset;
    }
    .farm-card--active {
      border-color: var(--farm-accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--farm-accent) 45%, transparent);
    }
    .farm-card__top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
      margin-bottom: 0.45rem;
    }
    .farm-card__top h3 { margin: 0; font-size: 0.88rem; }
    .farm-card__money {
      margin-left: auto;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--positive);
    }
    .farm-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
    }
    .farm-stat {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 0;
    }
    .farm-stat small {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
    }
    .farm-stat strong {
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }
    .farm-stat span {
      font-size: 0.68rem;
      color: var(--text-dim);
      line-height: 1.25;
    }

    /* Receipt activity */
    .receipt {
      max-width: 22rem;
      margin: 0 0 0.5rem;
      background: linear-gradient(180deg, #f4f1e8 0%, #ebe6d8 100%);
      color: #1a1a1a;
      border: 1px solid #c9c2b0;
      border-radius: 2px;
      padding: 0.75rem 0.85rem 0.65rem;
      font-family: "Courier New", Courier, ui-monospace, monospace;
      font-size: 0.72rem;
      box-shadow: 2px 3px 0 rgba(0,0,0,0.18);
    }
    .receipt h2 {
      margin: 0 0 0.25rem;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
    }
    .receipt__rule {
      display: block;
      border-top: 1px dashed #8a8476;
      margin: 0.3rem 0;
    }
    .receipt__line {
      appearance: none;
      display: grid;
      grid-template-columns: 1.25rem 1fr;
      gap: 0.4rem;
      width: 100%;
      padding: 0.35rem 0;
      border: 0;
      border-bottom: 1px dotted #b7b09e;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .receipt__line:hover { text-decoration: underline; }
    .receipt__mark { color: #5c574c; font-weight: 700; }
    .receipt__foot {
      text-align: center;
      color: #5c574c;
      letter-spacing: 0.2em;
      margin-top: 0.25rem;
    }

    /* Stub pages + dense data layouts */
    .stub-head {
      margin: 0 0 0.65rem;
    }
    .stub-head h1 {
      margin: 0 0 0.25rem;
      font-size: 1.1rem;
    }
    .stub-head p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.35;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.7rem;
      margin-bottom: 0.35rem;
      background: var(--bg-card);
      border: 1px solid var(--farm-border);
      border-radius: 10px;
      font-size: 0.8rem;
    }
    .row span { color: var(--text-dim); }
    .row strong { font-variant-numeric: tabular-nums; }
    .row--warn strong { color: var(--warning); }
    .row--pos strong { color: var(--positive); }
    .row--neg strong { color: var(--negative); }
    .row--info strong { color: var(--info); }

    .section-label {
      margin: 0.75rem 0 0.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 600;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }
    .metric {
      background: var(--bg-card);
      border: 1px solid var(--farm-border);
      border-radius: 10px;
      padding: 0.45rem 0.5rem;
      min-width: 0;
    }
    .metric small {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
      margin-bottom: 0.15rem;
    }
    .metric strong {
      display: block;
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .metric span {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.65rem;
      color: var(--text-dim);
      line-height: 1.25;
    }
    .metric--warn strong { color: var(--warning); }
    .metric--pos strong { color: var(--positive); }
    .metric--neg strong { color: var(--negative); }
    .metric--info strong { color: var(--info); }

    .detail {
      background: var(--bg-card);
      border: 1px solid var(--farm-border);
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.4rem;
    }
    .detail__top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .detail__top h4 {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .detail__status {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      border: 1px solid var(--farm-border);
      color: var(--text-normal);
    }
    .detail__status--warn {
      color: var(--warning);
      border-color: color-mix(in srgb, var(--warning) 45%, var(--farm-border));
    }
    .detail__status--pos {
      color: var(--positive);
      border-color: color-mix(in srgb, var(--positive) 45%, var(--farm-border));
    }
    .detail__status--neg {
      color: var(--negative);
      border-color: color-mix(in srgb, var(--negative) 45%, var(--farm-border));
    }
    .detail__meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.2rem 0.65rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.35;
    }
    .detail__meta b {
      color: var(--text-normal);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .detail__note {
      margin: 0.35rem 0 0;
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.3;
    }
    .bar {
      margin-top: 0.4rem;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--brand);
    }
    .bar--warn > i { background: var(--warning); }
    .bar--neg > i { background: var(--negative); }
    .bar--info > i { background: var(--info); }

    .kv {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
    }
    .kv__item {
      background: var(--bg-card);
      border: 1px solid var(--farm-border);
      border-radius: 10px;
      padding: 0.45rem 0.55rem;
    }
    .kv__item small {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
    }
    .kv__item strong {
      display: block;
      margin-top: 0.15rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.35rem;
      margin-bottom: 0.4rem;
    }
    .forecast__day {
      background: var(--bg-card);
      border: 1px solid var(--farm-border);
      border-radius: 10px;
      padding: 0.4rem 0.35rem;
      text-align: center;
    }
    .forecast__day small {
      display: block;
      font-size: 0.6rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .forecast__day strong {
      display: block;
      margin: 0.2rem 0;
      font-size: 0.78rem;
    }
    .forecast__day span {
      display: block;
      font-size: 0.62rem;
      color: var(--text-dim);
    }

    .hero__extra {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.45rem;
      margin-top: 0.65rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--rule);
    }
    .hero__extra small {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dim);
    }
    .hero__extra strong {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }
    .hero__extra .pos { color: var(--positive); }
    .hero__extra .neg { color: var(--negative); }
    .hero__extra .warn { color: var(--warning); }

    .mini-board {

      color: var(--text-dim);
      line-height: 1.3;
    }

    .alert__body {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;

    .alert__body small {
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .foot-note {
      margin: 0.85rem 0 0;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    const money = (n) => "€" + Math.round(n).toLocaleString("en-GB");

    let view = "overview";

    function setChrome() {
      const back = document.getElementById("btnBack");
      const title = document.getElementById("appTitle");
      const sub = document.getElementById("appSub");
      if (view === "overview") {
        back.disabled = true;
        title.textContent = "Dashboard";
        sub.textContent = DATA.farmName + " · " + DATA.mapTitle;
      } else {
        back.disabled = false;
        const stub = STUBS[view];
        title.textContent = stub ? stub.title : "App";
        sub.textContent = "Overview → " + (stub ? stub.title : view);
      }
    }

    function renderMetrics(metrics) {
      if (!metrics || !metrics.length) return "";
      return `<div class="metrics">${metrics.map((m) => `
        <div class="metric${m.tone ? " metric--" + m.tone : ""}">
          <small>${m.label}</small>
          <strong>${m.value}</strong>
          ${m.hint ? `<span>${m.hint}</span>` : ""}
        </div>`).join("")}</div>`;
    }

    function renderRows(items) {
      return items.map((r) => `
        <div class="row${r.tone ? " row--" + r.tone : ""}">
          <span>${r.label}</span>
          <strong>${r.value}</strong>
        </div>`).join("");
    }

    function renderKv(items) {
      return `<div class="kv">${items.map((r) => `
        <div class="kv__item">
          <small>${r.label}</small>
          <strong>${r.value}</strong>
        </div>`).join("")}</div>`;
    }

    function renderCards(items) {
      return items.map((c) => `
        <article class="detail">
          <div class="detail__top">
            <h4>${c.title}</h4>
            ${c.status ? `<span class="detail__status${c.statusTone ? " detail__status--" + c.statusTone : ""}">${c.status}</span>` : ""}
          </div>
          ${c.meta ? `<div class="detail__meta">${c.meta.map(([k, v]) =>
            `<span>${k}: <b>${v}</b></span>`).join("")}</div>` : ""}
          ${c.note ? `<p class="detail__note">${c.note}</p>` : ""}
          ${c.bar != null ? `<div class="bar${c.barTone ? " bar--" + c.barTone : ""}"><i style="width:${c.bar}%"></i></div>` : ""}
        </article>`).join("");
    }

    function renderForecast() {
      return `<div class="forecast">${DATA.forecast.map((d) => `
        <div class="forecast__day">
          <small>${d.day}</small>
          <strong>${d.temp}</strong>
          <span>${d.note}</span>
        </div>`).join("")}</div>`;
    }

    function renderOverview() {
      const t = DATA.tiles;
      const pl = DATA.incomeSession - DATA.expensesSession;
      return `
        <div class="banner">Vision prototype — not live game UI</div>

        <header class="ov-header">
          <div>
            <h1>Save overview</h1>
            <p>${DATA.mapTitle} · ${DATA.season} ${DATA.period} · ${DATA.daysPerPeriod} day/period — jump to what needs attention.</p>
          </div>
          <div class="ov-meta">
            <span class="badge badge--accent">${DATA.gameTime}</span>
            <span class="badge">${DATA.timeGuard}</span>
            <span class="badge">${DATA.mapTitle}</span>
            <button type="button" class="weather-pill" data-go="map" title="Weather">
              <span>${DATA.weather.temp}</span>
              <span>${DATA.weather.label}</span>
              <span>· ${DATA.weather.rainChance}</span>
            </button>
          </div>
        </header>

        <section class="mods" aria-label="Active mods">
          <h2>Active mods · ${DATA.mods.length}</h2>
          <div class="mods__row">
            ${DATA.mods.map((m) =>
              `<span class="badge badge--accent">${m.title}${m.version ? " " + m.version : ""}</span>`
            ).join("")}
          </div>
        </section>

        <section class="hero" aria-label="Current balance">
          <div class="hero__label">Current balance</div>
          <div class="hero__row">
            <div class="hero__bal">${money(DATA.balance)}</div>
            <div class="hero__loan">
              <small>Loan</small>
              <strong>${money(DATA.loan)}</strong>
            </div>
          </div>
          <div class="hero__extra">
            <div>
              <small>Session P/L</small>
              <strong class="${pl >= 0 ? "pos" : "neg"}">${pl >= 0 ? "+" : ""}${money(pl)}</strong>
            </div>
            <div>
              <small>Net worth</small>
              <strong class="pos">${money(DATA.netWorth)}</strong>
            </div>
            <div>
              <small>Runway</small>
              <strong class="warn">${DATA.runwayMonths} months</strong>

          </div>
        </section>

        <section class="alerts" aria-label="Needs attention">
          ${DATA.alerts.map((a) => `
            <button type="button" class="alert" data-go="${a.section}">
              <span class="alert__mark">!</span>
              <span class="alert__body">
                <span>${a.label}</span>
                ${a.detail ? `<small>${a.detail}</small>` : ""}
              </span>
            </button>

        </section>

        <section class="grid" aria-label="Overview tiles">
          <button type="button" class="tile" data-go="economy">
            <h3>Economy</h3>
            <div class="tile__finance">
              <div><span>Cash</span><strong>${money(t.economy.money)}</strong></div>
              <div><span>Loan</span><strong>${money(t.economy.loan)}</strong></div>
              <div><span>Net worth</span><strong>${money(t.economy.netWorth)}</strong></div>
              <div><span>Session P/L</span><strong>${t.economy.pl}</strong></div>
              <div><span>Tax (Mar)</span><strong>${t.economy.taxDue}</strong></div>
            </div>
          </button>

          <button type="button" class="tile" data-go="fields">
            <h3>Fields</h3>
            <p class="tile__stat"><strong>${t.fields.count}</strong><span>${t.fields.ha} ha owned</span></p>
            <p class="tile__line">${t.fields.needsWork} need work · ${t.fields.harvest} harvest · ${t.fields.growing} growing</p>
            <p class="tile__line">${t.fields.fallow} fallow / meadow</p>
          </button>

          <button type="button" class="tile" data-go="livestock">
            <h3>Pastures</h3>
            <p class="tile__stat"><strong>${t.livestock.heads}</strong><span>${t.livestock.dairy} dairy · ${t.livestock.sheep} sheep</span></p>
            <p class="tile__line">${t.livestock.milkGrade} · ${t.livestock.milkFresh} fresh</p>
            <p class="tile__line tile__warn">${t.livestock.warnings} pasture warning</p>
          </button>

          <button type="button" class="tile" data-go="fleet">

            <p class="tile__stat"><strong>${t.fleet.count}</strong><span>${t.fleet.motorized} motor · ${t.fleet.implements} impl.</span></p>

          </button>

          <button type="button" class="tile" data-go="productions">

          </button>

          <button type="button" class="tile" data-go="storage">

            <p class="tile__stat"><strong>${t.storage.capacityPct}%</strong><span>${(t.storage.siloL/1000).toFixed(1)}k L in silo</span></p>
            <p class="tile__line">${t.storage.fieldBales} field · ${t.storage.yardBales} yard · ${t.storage.pallets} pallets</p>
            <p class="tile__line tile__warn">${t.storage.wetBales} bales getting wet</p>
          </button>

          <button type="button" class="tile" data-go="soil">
            <h3>Soil</h3>
            <p class="tile__stat"><strong>${t.soil.tracked}</strong><span>tracked · OM ${t.soil.omAvg}</span></p>
            <p class="tile__line tile__warn">${t.soil.lowN} low N · ${t.soil.lowPH} low pH · ${t.soil.disease} disease</p>
            <p class="tile__line">${t.soil.scouted} fields scouted</p>
          </button>

          <button type="button" class="tile" data-go="map">
            <h3>Map &amp; weather</h3>
            <p class="tile__stat"><strong>${t.map.online}</strong><span>vehicles live</span></p>
            <p class="tile__line">${t.map.workers} workers · ${t.map.pins} pins · ${t.map.contracts} contracts</p>
            <p class="tile__line">${DATA.weather.temp} · rain ${DATA.weather.rainChance}</p>
          </button>
        </section>

        <section class="mini-board" aria-label="Priority board">
          <h2>Priority board</h2>
          <div class="mini-grid">
            ${DATA.attention.map((a) => `
              <button type="button" class="mini-card" data-go="${a.section}">
                <div class="mini-card__kicker">${a.kicker}</div>
                <div class="mini-card__title">${a.title}</div>
                <div class="mini-card__meta">${a.meta}</div>
                <div class="bar${a.warn ? " bar--warn" : ""}" style="margin-top:0.45rem"><i style="width:${a.pct}%"></i></div>
              </button>
            `).join("")}
          </div>
        </section>

        <section class="farms" aria-label="Your farms">
          <h2>Your farms</h2>
          ${DATA.farms.map((f) => `
            <article class="farm-card${f.active ? " farm-card--active" : ""}">
              <div class="farm-card__top">
                <h3>${f.name}</h3>
                ${f.active ? '<span class="badge badge--accent">Active</span>' : ""}
                ${f.players ? `<span class="badge">${f.players} online</span>` : '<span class="badge">Offline</span>'}
                <strong class="farm-card__money">${money(f.money)}</strong>
              </div>
              <div class="farm-stats">
                <div class="farm-stat">
                  <small>Fields</small>
                  <strong>${f.fields}</strong>
                  <span>${f.ha} ha · ${f.needsWork} work · ${f.harvest} harvest</span>
                </div>
                <div class="farm-stat">
                  <small>Livestock</small>
                  <strong>${f.livestock}</strong>
                  <span>${f.pastureWarn ? f.pastureWarn + " pasture warn" : "no warnings"}</span>
                </div>
                <div class="farm-stat">
                  <small>Fleet</small>
                  <strong>${f.fleet}</strong>
                  <span>${f.motorized} motorized</span>
                </div>
                <div class="farm-stat">
                  <small>Storage</small>
                  <strong>${f.storage}</strong>
                  <span>${f.bales} · ${f.productions} prod${f.prodIssues ? " · " + f.prodIssues + " issue" : ""}</span>
                </div>
              </div>
              ${f.loan > 0 ? `<p class="detail__note">Loan ${money(f.loan)}</p>` : `<p class="detail__note">No loan</p>`}
            </article>
          `).join("")}
        </section>

        <section class="section-label" style="margin-top:0">Market snapshot</section>
        <div class="kv" style="margin-bottom:0.85rem">
          ${DATA.markets.map((m) => `
            <div class="kv__item">
              <small>${m.crop}</small>
              <strong class="${m.tone === "pos" ? "" : ""}">${m.price} <span style="color:${
                m.tone === "pos" ? "var(--positive)" :
                m.tone === "neg" ? "var(--negative)" :
                m.tone === "warn" ? "var(--warning)" : "var(--text-dim)"
              };font-size:0.72rem">${m.delta}</span></strong>
            </div>`).join("")}
        </div>

        <section class="receipt" aria-label="Activity">
          <h2>Activity</h2>
          <span class="receipt__rule" aria-hidden="true"></span>
          ${DATA.activity.map((a) => `
            <button type="button" class="receipt__line"${a.section ? ` data-go="${a.section}"` : ""}>
              <span class="receipt__mark">${a.mark}</span>
              <span>${a.text}</span>
            </button>
          `).join("")}
          <div class="receipt__foot" aria-hidden="true">
            <span class="receipt__rule"></span>
            <span>· · ·</span>
          </div>
        </section>
      `;
    }

    function renderStub(id) {
      const stub = STUBS[id];
      if (!stub) {
        return `<p class="ov-header"><span style="color:var(--text-dim)">Unknown section.</span></p>`;
      }
      const body = (stub.sections || []).map((sec) => {
        let inner = "";
        if (sec.kind === "rows") inner = renderRows(sec.items);
        else if (sec.kind === "kv") inner = renderKv(sec.items);
        else if (sec.kind === "cards") inner = renderCards(sec.items);
        return `<div class="section-label">${sec.label}</div>${inner}`;
      }).join("");

      return `
        <div class="banner">Vision prototype — stub screen</div>
        <header class="stub-head">
          <h1>${stub.title}</h1>
          <p>${stub.lead}</p>
        </header>
        ${renderMetrics(stub.metrics)}
        ${stub.forecast ? `<div class="section-label">5-day outlook</div>${renderForecast()}` : ""}
        ${body}
        <p class="foot-note">Stub only — real FarmHub / Farm Tablet wiring comes after design sign-off.</p>
      `;
    }

    function render() {
      const el = document.getElementById("content");
      el.innerHTML = view === "overview" ? renderOverview() : renderStub(view);
      setChrome();
      el.scrollTop = 0;
    }

    function go(section) {
      if (!section || section === "overview") view = "overview";
      else if (STUBS[section]) view = section;
      else view = "overview";
      render();
    }

    document.getElementById("content").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-go]");
      if (!btn) return;
      go(btn.getAttribute("data-go"));
    });

    document.getElementById("btnBack").addEventListener("click", () => go("overview"));
    document.getElementById("btnHome").addEventListener("click", () => go("overview"));

    render();
  </script>
</body>
